[env:tembed]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_deps =
    lovyan03/LovyanGFX@^1
    bblanchon/ArduinoJson@^7
