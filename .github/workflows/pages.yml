name: Publica o instalador web
on:
  push:
    branches: [main]
    paths: ["firmware/**", "site/**", ".github/workflows/pages.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uvx --from platformio pio run -d firmware
      - run: |
          b=firmware/.pio/build/cardputer
          app0=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          uvx esptool --chip esp32s3 merge-bin -o site/firmware-merged.bin \
            0x0 $b/bootloader.bin 0x8000 $b/partitions.bin 0xe000 "$app0" 0x10000 $b/firmware.bin
          cp docs/mascot.png site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
